name: Release

# Pushing a tag like v3.0.0 builds the app, runs the tests and publishes a GitHub release with
# the portable zip and the MSI installer. It can also be started by hand from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "版本标签，例如 v3.0.0（需与 LabSchedule.App.csproj 中的 Version 一致）"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Check version matches tag
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content src/LabSchedule.App/LabSchedule.App.csproj -Encoding UTF8
          $version = ($csproj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match project version $version" }

      - name: Test
        run: dotnet test tests/LabSchedule.Core.Tests -c Release

      - name: Build portable zip and installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/release-win.ps1

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist/release -File | ForEach-Object { $_.FullName }
          $notes = "docs/releases/$env:TAG.md"
          $title = "实验排班生成器 $($env:TAG.TrimStart('v'))"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            # A release (or draft) already exists for this tag: refresh its files and publish it.
            gh release upload $env:TAG @files --clobber
            if (Test-Path $notes) { gh release edit $env:TAG --title $title --notes-file $notes --draft=false }
            else { gh release edit $env:TAG --title $title --draft=false }
          }
          elseif (Test-Path $notes) {
            gh release create $env:TAG @files --title $title --notes-file $notes --target $env:GITHUB_SHA
          }
          else {
            gh release create $env:TAG @files --title $title --generate-notes --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { throw "publishing the release failed" }
